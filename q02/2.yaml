apiVersion: v1
kind: Service
metadata:
  name: db-service
  labels:
    app: db-service
spec:
  clusterIP: None
  selector:
    app: db-cluster

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-cluster
spec:
  selector:
    matchLabels:
      app: db-cluster
  serviceName: "db-service"
  replicas: 3
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: db-cluster
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: mysql
        image: mysql:8
  volumeClaimTemplates:
  - metadata:
      name: db-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path"
      resources:
        requests:
          storage: 5Gi