apiVersion: v1
kind: Pod
metadata:
  name: api-server
spec:
  containers:
  - name: api-server
    image: httpd:latest
    ports:
    - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api-server
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007