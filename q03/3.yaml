apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    app: api-server
  name: api-server
spec:
  containers:
  - image: httpd:latest
    name: api-server
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api-server
  ports:
    - port: 80
      nodePort: 30007