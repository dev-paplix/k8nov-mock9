apiVersion: v1
kind: Pod
metadata:
  name: api-server
  labels:
    app: api  
spec:
  containers:
  - name: httpd
    image: httpd:latest 
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api 
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007