apiVersion: v1
kind: Pod
metadata:
  name: api-server
  namespace: three
spec:
  containers:
  - name: httpd
    image: httpd:latest
    ports:
    - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: three
spec:
  type: NodePort
  selector:
    app: httpd
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30017