apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: "debug"
  MAX_RETRIES: "5"

---

apiVersion: v1
kind: Pod
metadata:
  name: config-pod
spec:
  containers:
  - name: busybox
    image: busybox
    env:
      - name: LOG_LEVEL
        valueFrom:
          configMapKeyRef:
            name: app-config
            key: LOG_LEVEL

    volumeMounts:
    - name: config
      mountPath: "/etc/config"
      readOnly: true

  volumes:
  - name: config
    configMap:
      name: app-config
      items:
      - key: "MAX_RETRIES"
        path: "MAX_RETRIES"