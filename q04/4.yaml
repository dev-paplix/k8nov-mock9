apiVersion: v1
kind: Pod
metadata:
  name: config-pod
  labels:
    app: config-pod
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command: ["sh","-c","sleep 3600"]
    env:
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: LOG_LEVEL
    ports:
    - containerPort: 80
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
      subPath: MAX_RETRIES
  volumes:
  - name: config-volume
    configMap:
      name: app-config
