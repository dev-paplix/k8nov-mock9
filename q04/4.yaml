apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config 
  namespace: four
data:         
  LOG_LEVEL: debug
  MAX_RETRIES: "5"

---

apiVersion: v1
kind: Pod
metadata:
  name: config-pod
  namespace: four
spec:
  containers:
    - name: busybox 
      image: busybox:latest
      env:
        - name: LOG_LEVEL 
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: MAX-RETRIES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MAX-RETRIES
      volumeMounts:
      - name: path  
        mountPath: etc/config 
        readOnly: true
  volumes:
  - name: path
    configMap:
      name: app-config
      items:
      - key: MAX-RETRIES
        path: MAX-RETRIES