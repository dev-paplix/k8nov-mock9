apiVersion: v1
kind: Pod
metadata:
  name: db-client 
spec:
  containers:
  - name: mysql
    image: mysql:8
    env:
      - name: MYSQL_USER
        valueFrom:
          secretKeyRef:
            name: db-secret
            key: username
      - name: MYSQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-secret
            key: password
    ports:
    - containerPort: 3306
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
data:
  password: U2VjdXJlUEBzczEyMw==
  username: ZGJfdXNlcg==