apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-critical
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: critical-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical-app
  labels:
    app: critical-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: critical-app
  template:
    metadata:
      labels:
        app: critical-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
