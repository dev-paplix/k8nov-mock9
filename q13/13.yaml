apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-monitor
  labels:
    app: node-monitor
spec:
  selector:
    matchLabels:
      name: node-monitor
  template:
    metadata:
      labels:
        name: node-monitor
    spec:
      containers:
        - name: busybox
          image: busybox
          command:
            - sh
            - -c
            - >
              while true; do
                echo "Uptime: $(uptime)";
                sleep 5;
              done
