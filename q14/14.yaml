apiVersion: v1
kind: Service
metadata:
  name: service-frontend
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: service-backend
spec:
  ports:
    - name: http
      protocol: TCP
      port: 81
      targetPort: 81

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
spec:
#  ingressClassName: nginx-example
  rules:
  - http:
      paths:
      - path: /frontend
        pathType: Prefix
        backend:
          service:
            name: service-frontend
            port:
              number: 80
      - path: /backend
        pathType: Prefix
        backend:
          service:
            name: service-backend
            port:
              number: 81