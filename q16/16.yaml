apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-job
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: job
              image: alpine:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - tar -czf /backup/data.tar.gz /data
          restartPolicy: OnFailure
