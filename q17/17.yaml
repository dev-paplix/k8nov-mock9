apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    app: probe-test
  name: probe-test
spec:
  containers:
    - image: nginx:latest
      name: probe-test
      livenessProbe:
        httpGet:
          path: /healthz
          port: 80
        failureThreshold: 1
        periodSeconds: 60
        terminationGracePeriodSeconds: 60
      readinessProbe:
        httpGet:
          path: /ready
          port: 80
        failureThreshold: 1
        periodSeconds: 60
